name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Windows desktop (unsigned)
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ''
      CSC_KEY_PASSWORD: ''

    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install icon build dependency
        run: python -m pip install --disable-pip-version-check --no-input pillow

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Build Windows installer
        run: npm run dist:win --prefix desktop

      - name: Verify and hash the unsigned installer
        shell: pwsh
        run: |
          $installer = Join-Path $pwd 'desktop/dist/Manga-Sub-win-x64.exe'
          if (!(Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Windows installer was not produced: $installer"
          }

          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'NotSigned') {
            throw "Expected an unsigned installer, got Authenticode status $($signature.Status)."
          }

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          "$hash  Manga-Sub-win-x64.exe" | Set-Content -NoNewline -Encoding ascii 'desktop/dist/Manga-Sub-win-x64.exe.sha256'
          Write-Host "Unsigned installer SHA-256: $hash"

      - name: Ensure the GitHub release exists
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Manga Sub $RELEASE_TAG" --generate-notes
          fi

      - name: Upload Windows assets
        shell: bash
        run: gh release upload "$RELEASE_TAG" \
          desktop/dist/Manga-Sub-win-x64.exe \
          desktop/dist/Manga-Sub-win-x64.exe.sha256 \
          --clobber
