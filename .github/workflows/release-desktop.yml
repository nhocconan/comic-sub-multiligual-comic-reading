name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  windows:
    name: Windows signed installer (SignPath)
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Require SignPath configuration
        shell: pwsh
        run: |
          $required = @{
            SIGNPATH_API_TOKEN = $env:SIGNPATH_API_TOKEN
            SIGNPATH_ORGANIZATION_ID = $env:SIGNPATH_ORGANIZATION_ID
            SIGNPATH_PROJECT_SLUG = $env:SIGNPATH_PROJECT_SLUG
            SIGNPATH_SIGNING_POLICY_SLUG = $env:SIGNPATH_SIGNING_POLICY_SLUG
          }
          foreach ($entry in $required.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($entry.Value)) {
              throw "$($entry.Key) is not configured. Refusing to publish an unsigned Windows installer."
            }
          }

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Build unsigned Windows installer
        run: npm run dist:win --prefix desktop

      - name: Upload unsigned installer to the signing request
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          path: desktop/dist/Manga-Sub-win-x64.exe
          if-no-files-found: error
          archive: false
          retention-days: 1

      - name: Submit installer to SignPath
        id: sign-installer
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          github-token: ${{ github.token }}
          wait-for-completion: true
          skip-decompress: true
          output-artifact-directory: signed

      - name: Verify and stage the signed installer
        shell: pwsh
        run: |
          $signed = @(Get-ChildItem -Path signed -Filter '*.exe' -File -Recurse)
          if ($signed.Count -ne 1) {
            throw "Expected exactly one signed installer, found $($signed.Count)."
          }

          $destination = Join-Path $pwd 'desktop/dist/Manga-Sub-win-x64.exe'
          Copy-Item -LiteralPath $signed[0].FullName -Destination $destination -Force
          $signature = Get-AuthenticodeSignature -FilePath $destination
          if ($signature.Status -ne 'Valid') {
            throw "Windows signature is not valid: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -notmatch 'SignPath') {
            throw "Unexpected Windows signer: $($signature.SignerCertificate.Subject)"
          }
          Write-Host "Verified signer: $($signature.SignerCertificate.Subject)"

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $destination).Hash.ToLowerInvariant()
          "$hash  Manga-Sub-win-x64.exe" | Set-Content -NoNewline -Encoding ascii 'desktop/dist/Manga-Sub-win-x64.exe.sha256'

      - name: Ensure the GitHub release exists
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Manga Sub $RELEASE_TAG" --generate-notes
          fi

      - name: Upload signed Windows assets
        shell: bash
        run: gh release upload "$RELEASE_TAG" \
          desktop/dist/Manga-Sub-win-x64.exe \
          desktop/dist/Manga-Sub-win-x64.exe.sha256 \
          --clobber
